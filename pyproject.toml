[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebus-mqtt-client"
# Single source of truth: src/ebus_mqtt_client/__init__.py's __version__ (read
# dynamically below, and by setup.py's legacy path). Bump it in ONE place; a
# publish.yml guard fails the release if the git tag disagrees.
dynamic = ["version"]
description = "Standalone MQTT client wrapper around paho-mqtt with TLS, reconnection, subscription recovery, and topic pattern matching"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Clark Communications Corporation"}
]
keywords = ["mqtt", "paho", "iot", "tls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "paho-mqtt>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15.0", "mypy>=1.8"]

[project.urls]
Homepage = "https://ebus.energy"
Repository = "https://github.com/electrification-bus/ebus-mqtt-client"
Issues = "https://github.com/electrification-bus/ebus-mqtt-client/issues"

[tool.setuptools.dynamic]
version = {attr = "ebus_mqtt_client.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests

[tool.mypy]
python_version = "3.10"
files = ["src/ebus_mqtt_client"]
check_untyped_defs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true

# Treat the whole paho namespace as opaque (its symbols resolve to Any),
# independent of which paho major is installed. paho-mqtt 1.x ships no type
# information, while 2.x ships a py.typed marker but exposes a different
# callback-API type surface; this wrapper deliberately targets the v1 callback
# signatures and supports paho>=1.5.0 across the 1.x/2.x boundary. follow_imports
# = "skip" stops mypy following into paho's (typed 2.x or untyped 1.x) source, so
# our type-checking result stays stable regardless of the resolved paho version.
# ignore_missing_imports additionally covers the 1.x "no stubs" case.
[[tool.mypy.overrides]]
module = ["paho.*"]
follow_imports = "skip"
ignore_missing_imports = true
