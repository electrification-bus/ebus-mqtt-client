[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebus-mqtt-client"
version = "0.1.6"
description = "Standalone MQTT client wrapper around paho-mqtt with TLS, reconnection, subscription recovery, and topic pattern matching"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Clark Communications Corporation"}
]
keywords = ["mqtt", "paho", "iot", "tls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "paho-mqtt>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://ebus.energy"
Repository = "https://github.com/electrification-bus/ebus-mqtt-client"
Issues = "https://github.com/electrification-bus/ebus-mqtt-client/issues"

[tool.setuptools.packages.find]
where = ["src"]
