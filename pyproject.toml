[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebus-mqtt-client"
# Single source of truth: src/ebus_mqtt_client/__init__.py's __version__ (read
# dynamically below, and by setup.py's legacy path). Bump it in ONE place; a
# publish.yml guard fails the release if the git tag disagrees.
dynamic = ["version"]
description = "Standalone MQTT client wrapper around paho-mqtt with TLS, reconnection, subscription recovery, and topic pattern matching"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Clark Communications Corporation"}
]
keywords = ["mqtt", "paho", "iot", "tls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "paho-mqtt>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15.0"]

[project.urls]
Homepage = "https://ebus.energy"
Repository = "https://github.com/electrification-bus/ebus-mqtt-client"
Issues = "https://github.com/electrification-bus/ebus-mqtt-client/issues"

[tool.setuptools.dynamic]
version = {attr = "ebus_mqtt_client.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"
extend-exclude = [".beads"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests
